name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync upstream
        run: |
          git config user.name "ELPilotPR"
          git config user.email "ELPilotPR@users.noreply.github.com"
          git remote add upstream https://github.com/besuper/CityVilleDotnet.git
          git fetch upstream
          git merge upstream/main --no-edit || true
          git push origin main
